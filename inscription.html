<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Créer un compte</h2>

  <form class="form-membre" action="registre.php" method="POST">
